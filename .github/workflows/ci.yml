name: Evolua Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: evolua-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build e homologação local
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build da API
        run: npm run api:build

      - name: Validar scripts de homologação local
        run: |
          node --check scripts/apply-local-migrations.mjs
          node --check scripts/build-android-homologation.mjs
          node --check scripts/smoke-local-homologation.mjs
          node --check scripts/e2e-local-homologation.mjs
          node --check scripts/audit-local-media.mjs

      - name: Validar Docker Compose
        run: docker compose config >/dev/null
