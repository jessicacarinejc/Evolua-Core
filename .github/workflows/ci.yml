name: Evolua Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: evolua-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build e homologação local
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      API_PORT: '3333'
      DATABASE_URL: postgresql://evolua:evolua@127.0.0.1:5432/evolua_core
      SESSION_DAYS: '30'
      API_URL: http://127.0.0.1:3333/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build da API
        run: npm run api:build

      - name: Validar scripts de homologação local
        run: |
          node --check scripts/apply-local-migrations.mjs
          node --check scripts/start-local-homologation-api.mjs
          node --check scripts/verify-local-device-network.mjs
          node --check scripts/build-android-homologation.mjs
          node --check scripts/build-ios-homologation.mjs
          node --check scripts/smoke-local-homologation.mjs
          node --check scripts/e2e-local-homologation.mjs
          node --check scripts/audit-local-media.mjs

      - name: Validar Docker Compose de desenvolvimento
        run: docker compose config >/dev/null

      - name: Validar Docker Compose de homologação
        run: docker compose --env-file .env.homologation.example -f docker-compose.homologation.yml config >/dev/null

      - name: Subir PostgreSQL real para E2E
        run: |
          docker compose up -d postgres
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U evolua -d evolua_core >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Aplicar todas as migrações
        run: node scripts/apply-local-migrations.mjs

      - name: Iniciar API compilada
        run: |
          nohup npm --workspace @evolua/api run start > /tmp/evolua-api.log 2>&1 &
          echo $! > /tmp/evolua-api.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3333/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/evolua-api.log
          exit 1

      - name: Executar E2E dos fluxos principais
        run: node scripts/e2e-local-homologation.mjs

      - name: Exibir log da API em caso de falha
        if: failure()
        run: cat /tmp/evolua-api.log || true

      - name: Encerrar infraestrutura de teste
        if: always()
        run: docker compose down -v
