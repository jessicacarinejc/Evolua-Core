name: Theme and assistant v7 validation

on:
  push:
    branches:
      - feat/workout-reference-redesign-v5
    paths:
      - '.github/workflows/theme-assistant-v7-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar tema, assistente e APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_HOMOLOGATION_OFFLINE: '1'
      EXPO_PUBLIC_API_URL: http://offline.evolua.local/v1
      STRICT_EXERCISE_MEDIA: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/workout-reference-redesign-v5

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Typecheck mobile
        run: npm --workspace @evolua/mobile run typecheck

      - name: Preparar ferramentas de mídia
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check --quiet pillow

      - name: Preparar anatomia e mídia offline
        run: |
          node scripts/prepare-anatomy-asset.mjs
          npm run homologacao:media:prepare
          npm run homologacao:media:mobile

      - name: Preparar ambiente de build
        run: |
          printf 'EXPO_PUBLIC_HOMOLOGATION_OFFLINE=1\n' > .env.homologation
          printf 'EXPO_PUBLIC_API_URL=%s\n' "$EXPO_PUBLIC_API_URL" >> .env.homologation

      - name: Reparar PNG do branding
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          source = Path('apps/mobile/assets/brand/icon.png')
          target = Path('/tmp/evolua-core-icon.png')
          with Image.open(source) as image:
              image.load()
              image.convert('RGBA').save(target, format='PNG', optimize=False)
          source.write_bytes(target.read_bytes())
          PY

      - name: Gerar APK Android offline
        run: npm run homologacao:android

      - name: Publicar APK de teste
        uses: actions/upload-artifact@v7
        with:
          name: evolua-core-theme-assistant-v7-${{ github.sha }}
          path: |
            dist/*.apk
            dist/*.json
          if-no-files-found: error
          retention-days: 14
