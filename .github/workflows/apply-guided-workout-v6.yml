name: Apply Guided Workout V6

on:
  push:
    branches:
      - feat/workout-reference-redesign-v5
    paths:
      - 'scripts/patch-guided-workout-v6.mjs'
      - '.github/workflows/apply-guided-workout-v6.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/workout-reference-redesign-v5
          fetch-depth: 0

      - name: Aplicar patch do treino guiado
        run: node scripts/patch-guided-workout-v6.mjs

      - name: Validar diff
        run: |
          git diff --check
          node --check scripts/patch-guided-workout-v6.mjs

      - name: Commitar alterações geradas
        run: |
          git config user.name "evolua-core-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/screens/WorkoutExecutionScreen.tsx apps/mobile/app.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "feat: evoluir execução guiada cronometrada"
          git push origin HEAD:feat/workout-reference-redesign-v5
