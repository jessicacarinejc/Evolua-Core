name: Apply theme and assistant v7

on:
  push:
    branches:
      - feat/workout-reference-redesign-v5
    paths:
      - scripts/patch-theme-assistant-v7.mjs
      - .github/workflows/apply-theme-assistant-v7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/workout-reference-redesign-v5
          fetch-depth: 0

      - name: Aplicar alterações
        run: node scripts/patch-theme-assistant-v7.mjs

      - name: Validar diff
        run: git diff --check

      - name: Commitar alterações
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile
          git commit -m "feat: tema adaptativo e assistente offline funcional"
          git push origin HEAD:feat/workout-reference-redesign-v5
